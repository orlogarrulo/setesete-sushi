<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <style>
    .art { width: 1584px; height: 396px; background: var(--nori); color: var(--rice); }
    .grid { display: grid; grid-template-columns: 0.92fr 1.08fr; height: 100%; }
    .copy { padding: 56px 64px; display: flex; flex-direction: column; justify-content: center; }
    .lock { display: flex; align-items: center; gap: 18px; }
    .lock img { width: 78px; height: 78px; }
    .word { font-size: 22px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; }
    .tag { margin-top: 6px; font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gari); }
    h1 { margin-top: 28px; font-size: 42px; line-height: 1; max-width: 16ch; }
    .photo { position: relative; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
    .photo::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--nori) 0%, transparent 28%);
    }
  </style>
</head>
<body>
  <div class="art" id="shot">
    <div class="grid">
      <div class="copy">
        <div class="lock">
          <img src="/public/brand/selo.svg" alt="" />
          <div>
            <div class="word">Sete Sete</div>
            <div class="tag">Sushi · Luanda</div>
          </div>
        </div>
        <h1 class="display">Sushi fresco em Luanda.</h1>
      </div>
      <div class="photo">
        <img src="/public/photos/combinado.jpg" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
