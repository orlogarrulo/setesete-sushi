<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <style>
    .art { width: 1600px; height: 640px; background: var(--nori); color: var(--rice); }
    .bg { position: absolute; inset: 0; }
    .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(35,31,28,0.82) 0%, rgba(35,31,28,0.35) 46%, rgba(35,31,28,0.12) 100%); }
    .inner { position: relative; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; justify-content: flex-end; }
    .lock { display: flex; align-items: center; gap: 18px; }
    .lock img { width: 88px; height: 88px; }
    .word { font-size: 22px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; }
    .tag { margin-top: 6px; font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--gari); }
    h1 { margin-top: 22px; font-size: 56px; line-height: 0.95; max-width: 14ch; }
    .meta { margin-top: 18px; font-size: 16px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="art" id="shot">
    <div class="bg"><img src="/public/photos/combinado-close.jpg" alt="" /></div>
    <div class="veil"></div>
    <div class="inner">
      <div class="lock">
        <img src="/public/brand/selo.svg" alt="" />
        <div>
          <div class="word">Sete Sete</div>
          <div class="tag">Sushi fresco · Luanda</div>
        </div>
      </div>
      <h1 class="display">Peixe no ponto. Entrega à mesa.</h1>
      <div class="meta">12h – 22h · todos os dias</div>
    </div>
  </div>
</body>
</html>
